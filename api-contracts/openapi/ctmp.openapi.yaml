openapi: 3.0.3
info:
  title: CTMP API
  version: 1.0.0
  description: >
    Corporate Tender Management Platform API contract. Commercial envelope state
    and commercial visibility are separate controls: committee opening changes
    envelope state only, while commercial details still require explicit
    commercial permissions. All sensitive state changes, views, downloads,
    exports, permission changes, and exceptions must be audit logged.
servers:
  - url: /api/v1
    description: Versioned API root
tags:
  - name: Auth
  - name: Vendor Auth
  - name: Tenders
  - name: Clarifications
  - name: Bids
  - name: Late Submission
  - name: Technical Evaluation
  - name: Committee
  - name: Commercial Evaluation
  - name: Award
  - name: Audit
  - name: Reports
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Internal user login
      description: Authenticates internal users, typically backed by Active Directory.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout current user
      responses:
        '204':
          description: Logout succeeded.
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh an access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
  /auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Verify internal MFA challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: MFA verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'

  /vendor-auth/register:
    post:
      tags: [Vendor Auth]
      summary: Register a vendor organization
      description: >
        Public registration must validate CAPTCHA server-side, rate limit the
        request, log suspicious attempts, create an email verification token, and
        avoid creating an approved vendor before internal review.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorRegistrationRequest'
      responses:
        '202':
          description: Registration accepted for verification and review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorRegistrationAccepted'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vendor-auth/login:
    post:
      tags: [Vendor Auth]
      summary: Vendor user login
      description: >
        Authenticates vendor users by email and password. Returns an access
        token or, when MFA is enabled for the account, a challengeId for use
        with POST /vendor-auth/mfa/verify.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorLoginRequest'
      responses:
        '200':
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /vendor-auth/verify-email:
    post:
      tags: [Vendor Auth]
      summary: Verify vendor email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '204':
          description: Email verified.
  /vendor-auth/forgot-password:
    post:
      tags: [Vendor Auth]
      summary: Request vendor password reset
      description: Uses CAPTCHA and rate limiting and must not reveal whether the email exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Request accepted.
  /vendor-auth/reset-password:
    post:
      tags: [Vendor Auth]
      summary: Reset vendor password
      description: Reset token is single-use, expiring, audited, and invalidates active vendor sessions.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password reset completed.
  /vendor-auth/me:
    get:
      tags: [Vendor Auth]
      summary: Get the calling vendor's profile (self-service)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Vendor profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorProfileResponse'
    patch:
      tags: [Vendor Auth]
      summary: Update non-sensitive fields on the calling vendor's profile
      description: Email change is rejected here — use the verified-email flow.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorProfileUpdateRequest'
      responses:
        '200':
          description: Updated vendor profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorProfileResponse'
  /vendor-auth/me/bids:
    get:
      tags: [Vendor Auth]
      summary: List the calling vendor's bids across all tenders
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Vendor's bids.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyBidsListResponse'

  /vendor-auth/mfa/verify:
    post:
      tags: [Vendor Auth]
      summary: Verify vendor MFA challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: MFA verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'

  /tenders:
    get:
      tags: [Tenders]
      summary: List tenders visible to the current user
      description: Vendors see only public or invited tenders available to their organization.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TenderStatus'
        - name: departmentId
          in: query
          schema:
            type: string
            format: uuid
        - name: visibility
          in: query
          schema:
            type: string
            enum: [PUBLIC, INVITATION_ONLY]
        - name: submissionDeadlineBefore
          in: query
          schema:
            type: string
            format: date-time
        - name: submissionDeadlineAfter
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Tender list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenderListResponse'
    post:
      tags: [Tenders]
      summary: Create tender
      description: Requires tender:create. State-changing action must be audit logged.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenderCreateRequest'
      responses:
        '201':
          description: Tender created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tender'
  /tenders/{tenderId}:
    parameters:
      - $ref: '#/components/parameters/TenderId'
    get:
      tags: [Tenders]
      summary: Get tender detail
      description: Requires tender:view and respects vendor visibility rules.
      responses:
        '200':
          description: Tender detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tender'
    patch:
      tags: [Tenders]
      summary: Update draft or editable tender fields
      description: Requires tender:edit. Regulated transitions use explicit action endpoints instead.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenderUpdateRequest'
      responses:
        '200':
          description: Tender updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tender'
  /tenders/{tenderId}/documents/{documentId}:
    get:
      tags: [Tenders]
      summary: Download a tender document
      description: >
        Streams the requested tender document. Respects tender visibility and
        document-level visibility. Sensitive internal documents are audit logged
        on access.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenderId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Document file stream.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tenders/{tenderId}/submit-for-approval:
    post:
      tags: [Tenders]
      summary: Submit tender for approval
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenderId'
      responses:
        '200':
          description: Tender submitted for approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tender'
  /tenders/{tenderId}/publish:
    post:
      tags: [Tenders]
      summary: Publish tender
      description: Requires tender:publish and writes an audit event.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenderId'
      responses:
        '200':
          description: Tender published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tender'
  /tenders/{tenderId}/cancel:
    post:
      tags: [Tenders]
      summary: Cancel tender
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Tender cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tender'
  /tenders/{tenderId}/close-submissions:
    post:
      tags: [Tenders]
      summary: Close tender submissions
      description: Requires tender:close_submission. Normal bid submission is blocked after this action.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenderId'
      responses:
        '200':
          description: Tender moved to Submission Closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tender'

  /tenders/{tenderId}/approve:
    post:
      tags: [Tenders]
      summary: Approve tender from Internal Review
      description: Requires tenders:approve. Transitions Internal Review → Approved. Writes approval_action and audit log.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenderId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comments:
                  type: string
      responses:
        '200':
          description: Tender approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tender'

  /tenders/{tenderId}/reject:
    post:
      tags: [Tenders]
      summary: Reject tender from Internal Review
      description: Requires tenders:approve. Reason is mandatory for audit. Sends back to Draft.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Tender rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tender'

  /tenders/{tenderId}/clarifications:
    parameters:
      - $ref: '#/components/parameters/TenderId'
    get:
      tags: [Clarifications]
      summary: List clarifications
      description: Vendors see only their own private clarifications plus general/public replies.
      responses:
        '200':
          description: Clarification list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationListResponse'
    post:
      tags: [Clarifications]
      summary: Create vendor clarification
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClarificationCreateRequest'
      responses:
        '201':
          description: Clarification created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clarification'
  /clarifications/{clarificationId}/reply:
    post:
      tags: [Clarifications]
      summary: Reply to clarification
      description: Replies are private unless explicitly marked general/public by authorized users.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClarificationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClarificationReplyRequest'
      responses:
        '201':
          description: Reply created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClarificationReply'

  /tenders/{tenderId}/bids/draft:
    post:
      tags: [Bids]
      summary: Create or return current vendor bid draft
      description: Vendor may submit one primary bid per tender unless alternative bids are enabled.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenderId'
      responses:
        '201':
          description: Draft bid created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bid'
    get:
      tags: [Bids]
      summary: List bids for a tender (admin only)
      description: Requires bids:list. Commercial amounts are hidden unless caller has commercial:view; the commercialDetailsVisible flag per row indicates whether commercial fields are populated.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenderId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Tender bids list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenderBidsListResponse'
  /bids/{bidId}/technical-envelope:
    put:
      tags: [Bids]
      summary: Upload or replace technical envelope contents before submission
      description: Submitted bids are immutable; documents receive server-computed SHA-256 checksums on submission.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BidId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnvelopeUploadRequest'
      responses:
        '200':
          description: Technical envelope updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidEnvelope'
  /bids/{bidId}/commercial-envelope:
    put:
      tags: [Bids]
      summary: Upload or replace commercial envelope contents before submission
      description: This endpoint does not open, view, or download commercial content.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BidId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnvelopeUploadRequest'
      responses:
        '200':
          description: Commercial envelope updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidEnvelope'
  /bids/{bidId}/submit:
    post:
      tags: [Bids]
      summary: Submit bid
      description: >
        Submission locks the bid and both envelopes, records checksums, creates a
        receipt, and writes an audit event. After the submission deadline this
        requires an active tender-specific and vendor-specific late submission
        exception.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BidId'
      responses:
        '200':
          description: Bid submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidSubmissionReceipt'
        '409':
          $ref: '#/components/responses/Conflict'
  /bids/{bidId}/receipt:
    get:
      tags: [Bids]
      summary: Get bid submission receipt
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BidId'
      responses:
        '200':
          description: Submission receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidSubmissionReceipt'

  /bids/{bidId}/envelopes/{envelopeType}/documents:
    post:
      tags: [Bids]
      summary: Upload a single document to a DRAFT envelope (vendor self-service)
      description: >
        Multipart upload. Server computes SHA-256 over the byte stream and persists the
        resulting BidDocument row. Only allowed when bid status = DRAFT and envelope
        status = DRAFT. Audit-logged. Vendor JWT scoped.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BidId'
        - name: envelopeType
          in: path
          required: true
          schema:
            type: string
            enum: [TECHNICAL, COMMERCIAL]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidDocumentUploadResponse'
    get:
      tags: [Bids]
      summary: List documents currently attached to a DRAFT envelope
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BidId'
        - name: envelopeType
          in: path
          required: true
          schema:
            type: string
            enum: [TECHNICAL, COMMERCIAL]
      responses:
        '200':
          description: Envelope contents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidEnvelopeContents'

  /bids/{bidId}/documents/{documentId}:
    delete:
      tags: [Bids]
      summary: Remove a document from a DRAFT envelope (vendor self-service)
      description: Only allowed on DRAFT bid + DRAFT envelope. Audit-logged.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BidId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Document removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
    get:
      tags: [Bids]
      summary: Download a bid document
      description: >
        Streams the requested bid document. Technical documents require
        technical:view and the technical envelope to be OPENED. Commercial
        documents require the commercial envelope to be OPENED plus
        commercial:download permission. Every commercial document download is
        audit logged. No generic /files/{id}/download route exists — all
        downloads go through this endpoint so permission and state checks
        are always enforced.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BidId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Document file stream.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tenders/{tenderId}/late-submission-exceptions:
    parameters:
      - $ref: '#/components/parameters/TenderId'
    get:
      tags: [Late Submission]
      summary: List late submission exceptions for a tender
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Late submission exception list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LateSubmissionExceptionListResponse'
    post:
      tags: [Late Submission]
      summary: Grant or request late submission exception
      description: Requires tender-specific vendor-specific reason, expiry, approving/granting user, and audit trail.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LateSubmissionExceptionCreateRequest'
      responses:
        '201':
          description: Exception created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LateSubmissionException'

  /tenders/{tenderId}/technical-opening:
    post:
      tags: [Technical Evaluation]
      summary: Open technical envelopes
      description: Technical envelopes can open only after Submission Closed. Commercial envelopes remain sealed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenderId'
      responses:
        '200':
          description: Technical opening completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicalOpeningResult'
  /tenders/{tenderId}/technical-evaluations:
    get:
      tags: [Technical Evaluation]
      summary: List technical evaluations for a tender
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenderId'
      responses:
        '200':
          description: Technical evaluations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicalEvaluationListResponse'
  /bids/{bidId}/technical-evaluations:
    post:
      tags: [Technical Evaluation]
      summary: Submit technical evaluation for a bid
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BidId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnicalEvaluationRequest'
      responses:
        '201':
          description: Technical evaluation recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicalEvaluation'
  /tenders/{tenderId}/finalize-technical-results:
    post:
      tags: [Technical Evaluation]
      summary: Finalize technical pass/fail results
      description: Only technically passed vendors proceed to commercial comparison.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenderId'
      responses:
        '200':
          description: Technical results finalized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicalEvaluationListResponse'
  /tenders/{tenderId}/technical-criteria:
    get:
      tags: [Technical Evaluation]
      summary: Get evaluation criteria configured for tender
      description: Returns criteria list + pass threshold for the scorecard UI. Falls back to department/tender-type defaults if no tender-specific criteria stored.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenderId'
      responses:
        '200':
          description: Criteria configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicalCriteriaResponse'

  /tenders/{tenderId}/committee-sessions:
    post:
      tags: [Committee]
      summary: Create committee commercial opening session
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitteeSessionCreateRequest'
      responses:
        '201':
          description: Committee session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitteeSession'
    get:
      tags: [Committee]
      summary: List committee sessions for tender
      description: Newest first. Members[] populated with attendance flag once attendance has been recorded.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenderId'
      responses:
        '200':
          description: Committee session list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitteeSessionListResponse'
  /committee-sessions/{sessionId}/attendance:
    post:
      tags: [Committee]
      summary: Record committee attendance
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitteeAttendanceRequest'
      responses:
        '200':
          description: Attendance recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitteeSession'
  /committee-sessions/{sessionId}/open-commercial-envelopes:
    post:
      tags: [Committee]
      summary: Open commercial envelopes through official committee session
      description: >
        The only endpoint that may change commercial envelopes from sealed to
        opened. It opens only technically qualified vendors' commercial
        envelopes, verifies checksums before access, records committee details,
        and writes audit events. It must not return commercial prices or files;
        details remain controlled by commercial:view/download/evaluate/export.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommercialOpeningRequest'
      responses:
        '200':
          description: Commercial envelopes opened; status and opening records returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialOpeningResult'
  /committee-sessions/{sessionId}/opening-records:
    get:
      tags: [Committee]
      summary: List commercial opening records
      description: Requires committee:view_minutes. Returns status and checksum results, not commercial details.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Opening records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialOpeningRecordListResponse'

  /tenders/{tenderId}/commercial-comparison:
    get:
      tags: [Commercial Evaluation]
      summary: Get commercial comparison
      description: >
        Shows only technically passed vendors. Users without commercial:view see
        status-only rows. Prices, scoring, documents, downloads, and exports
        require explicit commercial permissions and must be audit logged.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenderId'
      responses:
        '200':
          description: Commercial comparison respecting caller permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialComparison'
  /bids/{bidId}/commercial-evaluations:
    post:
      tags: [Commercial Evaluation]
      summary: Submit commercial evaluation for a bid
      description: Requires envelope OPENED and commercial:evaluate. The action is audit logged.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BidId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommercialEvaluationRequest'
      responses:
        '201':
          description: Commercial evaluation recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialEvaluation'

  /tenders/{tenderId}/award-recommendation:
    post:
      tags: [Award]
      summary: Create award recommendation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AwardRecommendationRequest'
      responses:
        '201':
          description: Award recommendation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwardRecommendation'
  /tenders/{tenderId}/award-approval:
    post:
      tags: [Award]
      summary: Approve or reject award recommendation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AwardApprovalRequest'
      responses:
        '200':
          description: Award approval action recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwardRecommendation'
  /tenders/{tenderId}/award:
    post:
      tags: [Award]
      summary: Finalize tender award
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenderId'
      responses:
        '200':
          description: Tender awarded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tender'

  /audit-logs:
    get:
      tags: [Audit]
      summary: Search audit logs
      description: Requires audit:view. Audit export requires audit:export.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: eventType
          in: query
          schema:
            type: string
        - name: entityType
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Audit log results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
  /tenders/{tenderId}/audit-logs:
    get:
      tags: [Audit]
      summary: Search audit logs for a tender
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenderId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Tender audit logs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
  /reports:
    get:
      tags: [Reports]
      summary: List available reports
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Report definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDefinitionListResponse'
  /reports/{reportCode}/export:
    post:
      tags: [Reports]
      summary: Export report
      description: Commercial comparison exports require commercial:export in addition to reports:export and are audit logged.
      security:
        - bearerAuth: []
      parameters:
        - name: reportCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportExportRequest'
      responses:
        '202':
          description: Export job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExportJob'

  /reports/jobs:
    get:
      tags: [Reports]
      summary: List recent report export jobs for caller
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Recent jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExportJobListResponse'
  /reports/jobs/{jobId}:
    get:
      tags: [Reports]
      summary: Get report export job status
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Export job status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExportJob'
  /reports/jobs/{jobId}/download:
    get:
      tags: [Reports]
      summary: Download completed report export
      description: >
        Streams the completed export file. Requires reports:export. Commercial
        report downloads additionally require commercial:export. Every download
        is audit logged.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Export file stream.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'

  /vendors:
    get:
      tags: [Vendors]
      summary: List vendors (admin)
      description: Requires vendors:list. Filter by registrationStatus.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING_APPROVAL, APPROVED, REJECTED, SUSPENDED, BLACKLISTED]
      responses:
        '200':
          description: Vendor list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorListResponse'
  /vendors/{vendorId}:
    get:
      tags: [Vendors]
      summary: Get vendor profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VendorId'
      responses:
        '200':
          description: Vendor profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
    patch:
      tags: [Vendors]
      summary: Update vendor profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VendorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorUpdateRequest'
      responses:
        '200':
          description: Vendor updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
  /vendors/{vendorId}/approve:
    post:
      tags: [Vendors]
      summary: Approve vendor registration
      description: Requires vendors:approve. Vendor must have emailVerified=true. Transitions PENDING_APPROVAL → APPROVED. Sends approval email. Audit logged.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VendorId'
      responses:
        '200':
          description: Vendor approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
  /vendors/{vendorId}/reject:
    post:
      tags: [Vendors]
      summary: Reject vendor registration
      description: Reason required for audit. Transitions PENDING_APPROVAL → REJECTED.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VendorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Vendor rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
  /vendors/{vendorId}/suspend:
    post:
      tags: [Vendors]
      summary: Suspend approved vendor
      description: Reason required for audit. Transitions APPROVED → SUSPENDED. Revokes active vendor sessions (bumps token version).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VendorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Vendor suspended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'

  /roles:
    get:
      tags: [Roles]
      summary: List roles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Role list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
  /roles/{roleId}/permissions:
    get:
      tags: [Roles]
      summary: Get permission IDs assigned to role
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoleId'
      responses:
        '200':
          description: Permission IDs.
          content:
            application/json:
              schema:
                type: object
                required: [permissionIds]
                properties:
                  permissionIds:
                    type: array
                    items:
                      type: string
                      format: uuid
    patch:
      tags: [Roles]
      summary: Replace permission set for role
      description: System roles (is_system=true) are read-only and return 403. Each add/remove emits an audit event.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissionIds]
              properties:
                permissionIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Permissions updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissionIds:
                    type: array
                    items:
                      type: string
                      format: uuid
  /permissions:
    get:
      tags: [Permissions]
      summary: List all permission definitions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Permission catalogue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListResponse'

  /notification-templates:
    get:
      tags: [Notifications]
      summary: List notification templates
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Template list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTemplateListResponse'
  /notification-templates/{templateId}:
    patch:
      tags: [Notifications]
      summary: Update notification template subject, body, or enabled flag
      description: Reject empty bodyTemplate. Audits subject/body diff + enabled flips.
      security:
        - bearerAuth: []
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                bodyTemplate:
                  type: string
                enabled:
                  type: boolean
      responses:
        '200':
          description: Template updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTemplate'

  /system-settings:
    get:
      tags: [System Settings]
      summary: List platform settings (excluding secrets)
      description: Sensitive keys (JWT secrets, credentials) are never returned here.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettingListResponse'
  /system-settings/batch:
    post:
      tags: [System Settings]
      summary: Batch update platform settings
      description: Atomic. Validates each value against the declared type. Rejects updates to read_only or sensitive keys. Per-key audit log.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updates]
              properties:
                updates:
                  type: array
                  items:
                    type: object
                    required: [key, value]
                    properties:
                      key:
                        type: string
                      value:
                        type: string
      responses:
        '200':
          description: Settings updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettingListResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenderId:
      name: tenderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BidId:
      name: bidId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClarificationId:
      name: clarificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VendorId:
      name: vendorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    Unauthorized:
      description: Authentication failed or token is missing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Caller lacks the required permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Request conflicts with current workflow state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: CTMP_VALIDATION_ERROR
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            traceId:
              type: string
    VendorLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    MfaVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId:
          type: string
        code:
          type: string
    AuthTokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
    TokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    ForgotPasswordRequest:
      type: object
      required: [email, captchaToken]
      properties:
        email:
          type: string
          format: email
        captchaToken:
          type: string
    ResetPasswordRequest:
      type: object
      required: [token, newPassword, captchaToken]
      properties:
        token:
          type: string
        newPassword:
          type: string
          format: password
        captchaToken:
          type: string
    VendorRegistrationRequest:
      type: object
      required: [companyName, registrationNumber, contactName, email, password, captchaToken]
      properties:
        companyName:
          type: string
        registrationNumber:
          type: string
        taxNumber:
          type: string
        contactName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          format: password
        captchaToken:
          type: string
    VendorRegistrationAccepted:
      type: object
      required: [registrationRequestId, status]
      properties:
        registrationRequestId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING_EMAIL_VERIFICATION, PENDING_REVIEW]
    TenderStatus:
      type: string
      enum:
        - DRAFT
        - INTERNAL_REVIEW
        - APPROVED
        - PUBLISHED
        - CLARIFICATION_PERIOD
        - SUBMISSION_CLOSED
        - TECHNICAL_OPENING
        - TECHNICAL_EVALUATION
        - COMMERCIAL_SEALED
        - COMMITTEE_COMMERCIAL_OPENING
        - COMMERCIAL_EVALUATION
        - AWARD_RECOMMENDATION
        - AWARDED
        - TENDER_CLOSED
        - CANCELLED
        - SUSPENDED
        - ARCHIVED
    EnvelopeType:
      type: string
      enum: [TECHNICAL, COMMERCIAL]
    EnvelopeStatus:
      type: string
      enum: [DRAFT, SUBMITTED, SEALED, OPENED, LOCKED]
    BidStatus:
      type: string
      enum: [DRAFT, SUBMITTED, LATE_SUBMITTED, LATE_ACCEPTED, WITHDRAWN, DISQUALIFIED]
    VendorStatus:
      type: string
      enum: [PENDING_REVIEW, APPROVED, REJECTED, SUSPENDED, BLACKLISTED]
    Tender:
      type: object
      required: [id, title, status, submissionDeadline]
      properties:
        id:
          type: string
          format: uuid
        referenceNumber:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/TenderStatus'
        visibility:
          type: string
          enum: [PUBLIC, INVITATION_ONLY]
        departmentId:
          type: string
          format: uuid
        submissionDeadline:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TenderCreateRequest:
      type: object
      required: [title, visibility, submissionDeadline]
      properties:
        title:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum: [PUBLIC, INVITATION_ONLY]
        departmentId:
          type: string
          format: uuid
        submissionDeadline:
          type: string
          format: date-time
        invitedVendorIds:
          type: array
          items:
            type: string
            format: uuid
    TenderUpdateRequest:
      type: object
      description: All fields optional for partial update (PATCH semantics).
      properties:
        title:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum: [PUBLIC, INVITATION_ONLY]
        departmentId:
          type: string
          format: uuid
        submissionDeadline:
          type: string
          format: date-time
        invitedVendorIds:
          type: array
          items:
            type: string
            format: uuid
    TenderListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Tender'
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
    Clarification:
      type: object
      required: [id, tenderId, question, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tenderId:
          type: string
          format: uuid
        vendorId:
          type: string
          format: uuid
        question:
          type: string
        status:
          type: string
          enum: [OPEN, ANSWERED, CLOSED]
        createdAt:
          type: string
          format: date-time
    ClarificationCreateRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
    ClarificationReplyRequest:
      type: object
      required: [reply]
      properties:
        reply:
          type: string
        visibility:
          type: string
          enum: [PRIVATE_TO_VENDOR, GENERAL_PUBLIC]
          default: PRIVATE_TO_VENDOR
    ClarificationReply:
      type: object
      required: [id, clarificationId, reply, visibility]
      properties:
        id:
          type: string
          format: uuid
        clarificationId:
          type: string
          format: uuid
        reply:
          type: string
        visibility:
          type: string
          enum: [PRIVATE_TO_VENDOR, GENERAL_PUBLIC]
    ClarificationListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Clarification'
    Bid:
      type: object
      required: [id, tenderId, vendorId, status]
      properties:
        id:
          type: string
          format: uuid
        tenderId:
          type: string
          format: uuid
        vendorId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/BidStatus'
        isAlternative:
          type: boolean
        submittedAt:
          type: string
          format: date-time
        envelopes:
          type: array
          items:
            $ref: '#/components/schemas/BidEnvelope'
    BidEnvelope:
