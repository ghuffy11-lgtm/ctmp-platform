# =============================================================================
# CTMP admin portal — TLS reverse proxy (container listens 443, published as
# host :4202). Single origin: serves the Next.js admin UI and proxies /api/* to
# the NestJS API, so the browser never makes a cross-origin call.
#
# Cert: wildcard *.hadiclinic.com.kw, mounted read-only at /etc/nginx/certs.
# The API itself (NestJS + helmet) emits CSP / HSTS / security headers, so this
# proxy only terminates TLS and forwards the single upstream hop the API trusts.
# =============================================================================

upstream ctmp_api {
    server api:3000;
}
upstream ctmp_web_admin {
    server web-admin:4200;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ctmp.hadiclinic.com.kw;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # RFQ / tender / branding / bid PDF uploads.
    client_max_body_size 50m;

    # ---- API ----------------------------------------------------------------
    # Keep the /api/ prefix intact: the NestJS global prefix is `api` and it
    # serves under /api/v1/*. trust proxy=1 expects exactly this single hop.
    location /api/ {
        proxy_pass http://ctmp_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Report exports / PDF streams can take a while.
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # ---- Admin UI (Next.js) -------------------------------------------------
    location / {
        proxy_pass http://ctmp_web_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
