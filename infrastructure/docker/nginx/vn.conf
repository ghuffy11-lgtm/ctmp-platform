# =============================================================================
# CTMP vendor portal — TLS reverse proxy (container 443, published as :4201).
# DMZ / public-facing. Single origin for the vendor browser:
#   /        -> web-vendor:4300          (Next.js vendor UI)
#   /api/*   -> https://10.1.27.99:4202  (admin API, internal hop over the LAN)
#
# The /api hop is dialed by IP with an explicit Host + SNI so the admin nginx
# matches its ctmp.hadiclinic.com.kw server block and forwards to api:3000.
# Vendor users carry vendor JWTs; RBAC on the API gates every commercial/admin
# endpoint, so proxying the shared API here does not grant vendor access to
# internal data.
# =============================================================================

upstream ctmp_web_vendor {
    server web-vendor:4300;
}

server {
    listen 443 ssl;
    http2 on;
    server_name vn.hadiclinic.com.kw;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Vendor bid PDF uploads.
    client_max_body_size 50m;

    # ---- API (proxied to the admin server over the LAN) ---------------------
    location /api/ {
        proxy_pass https://10.1.27.99:4202;
        proxy_http_version 1.1;
        # Make the admin nginx match its ctmp.hadiclinic.com.kw server block.
        proxy_set_header Host              ctmp.hadiclinic.com.kw;
        proxy_ssl_server_name on;
        proxy_ssl_name        ctmp.hadiclinic.com.kw;
        # Internal hop between our own hosts; the admin cert is a valid DigiCert
        # but nginx:alpine has no CA bundle wired here — skip upstream verify.
        proxy_ssl_verify      off;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # ---- Vendor UI (Next.js) ------------------------------------------------
    location / {
        proxy_pass http://ctmp_web_vendor;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
