version: '3.9'

name: ctmp

services:
  postgres:
    image: postgres:16-alpine
    container_name: ctmp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ctmp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctmp_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ctmp}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ctmp} -d ${POSTGRES_DB:-ctmp}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ctmp-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ctmp-mailhog
    restart: unless-stopped
    ports:
      - '${MAILHOG_SMTP_PORT:-1025}:1025'
      - '${MAILHOG_WEB_PORT:-8025}:8025'

  minio:
    image: minio/minio:RELEASE.2024-12-13T22-19-12Z
    container_name: ctmp-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ctmpadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ctmpadmin_dev}
    command: server /data --console-address ':9001'
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: ctmp-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ctmp}:${POSTGRES_PASSWORD:-ctmp_dev}@postgres:5432/${POSTGRES_DB:-ctmp}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET required}
      VENDOR_JWT_SECRET: ${VENDOR_JWT_SECRET:?VENDOR_JWT_SECRET required}
      VENDOR_JWT_REFRESH_SECRET: ${VENDOR_JWT_REFRESH_SECRET:?VENDOR_JWT_REFRESH_SECRET required}
      AD_URL: ${AD_URL:-ldap://ad.local:389}
      AD_BIND_DN: ${AD_BIND_DN:-}
      AD_BIND_PASSWORD: ${AD_BIND_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-hcaptcha}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      REPORT_STORAGE_PATH: /data/reports
      REPORT_WORKER_ENABLED: ${REPORT_WORKER_ENABLED:-true}
      REPORT_WORKER_CONCURRENCY: ${REPORT_WORKER_CONCURRENCY:-2}
      REPORT_QUEUE_NAME: ${REPORT_QUEUE_NAME:-ctmp-report-exports}
      BID_STORAGE_PATH: /data/bid-documents
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_ROOT: /data
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-http://minio:9000}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-ctmpadmin}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-ctmpadmin_dev}
      STORAGE_S3_BUCKET_PREFIX: ${STORAGE_S3_BUCKET_PREFIX:-ctmp}
      STORAGE_S3_FORCE_PATH_STYLE: 'true'
      STORAGE_S3_AUTO_CREATE_BUCKETS: ${STORAGE_S3_AUTO_CREATE_BUCKETS:-true}
      AUDIT_VERIFY_ON_START: ${AUDIT_VERIFY_ON_START:-true}
      AUDIT_VERIFY_LIMIT: ${AUDIT_VERIFY_LIMIT:-1000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:4300}
    ports:
      - '${API_PORT:-3000}:3000'
    volumes:
      - report_storage:/data/reports
      - bid_storage:/data/bid-documents
      # BUG-067 / WALK-016/017: tender RFQ documents (admin uploads, vendor
      # downloads) need their own volume so files survive container recreates.
      # Without this mount the files lived inside the container FS and were
      # wiped on every `docker compose up --force-recreate api`.
      - tender_storage:/data/tender-documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/api/v1/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # BUG-089 (2026-06-02): admin + vendor each take their OWN API URL so the
  # admin browser never calls the vendor host (and vice versa). Previously a
  # single PUBLIC_API_URL was shared, and on staging it was set to the vendor
  # host — every admin /api/v1/* call went to vn.hadiclinic.com.kw:4201,
  # producing cross-origin 401s after idle timeout. Each app now has a
  # dedicated env var with the legacy PUBLIC_API_URL kept as the fallback.
  web-admin:
    build:
      context: ../..
      dockerfile: infrastructure/docker/web-admin.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${ADMIN_PUBLIC_API_URL:-${PUBLIC_API_URL:-http://localhost:3000}}
    container_name: ctmp-web-admin
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${ADMIN_PUBLIC_API_URL:-${PUBLIC_API_URL:-http://localhost:3000}}
    ports:
      - '${WEB_ADMIN_PORT:-4200}:4200'
    depends_on:
      - api

  web-vendor:
    build:
      context: ../..
      dockerfile: infrastructure/docker/web-vendor.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${VENDOR_PUBLIC_API_URL:-${PUBLIC_API_URL:-http://localhost:3000}}
        NEXT_PUBLIC_HCAPTCHA_SITE_KEY: ${HCAPTCHA_SITE_KEY:-10000000-ffff-ffff-ffff-000000000001}
    container_name: ctmp-web-vendor
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${VENDOR_PUBLIC_API_URL:-${PUBLIC_API_URL:-http://localhost:3000}}
    ports:
      - '${WEB_VENDOR_PORT:-4300}:4300'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  report_storage:
  bid_storage:
  tender_storage:
  minio_data:
